<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EASY AI — من EASY CODE</title>
<!-- ═══════════════════════════════════════════════════════════
     EASY AI — صفحة شات ذكي بستايل فخم (من EASY CODE)
     ⚙️ لتخصيصها لعميل جديد غيّر الأسطر دي بس:
     ═══════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  API: 'https://shark-vision-labs.base44.app/functions/easyChat', // رابط خدمة الذكاء الاصطناعي (المفتاح محفوظ سيرفر)
  CLIENT_NAME: '',            // ← اسم العميل الجديد هنا (مثال: 'شركة النور') — سيظهر في العنوان
  BRAND: 'EASY CODE',          // اسم البراند
  SLOGAN: 'Apps Made Easy',
  MODEL: 'deepseek/deepseek-v4-flash-free', // موديل مجاني — صفر تكلفة
  GREETING: 'أهلاً بيك 👋 أنا *EASY AI* مساعدك الذكي من *EASY CODE*.\n\nاسألني في أي حاجة: كتابة إعلانات، أفكار مشاريع، ترجمة، دراسة، سوشيال ميديا… وكل حاجة تانية.'
};
</script>
<style>
  :root{
    --bg:#0a0a10; --bg2:#0e0e16; --gold:#d4af37; --gold2:#f6e27a; --goldsoft:rgba(212,175,55,.14);
    --txt:#ece9df; --mut:#9b9788; --line:rgba(212,175,55,.22); --glass:rgba(255,255,255,.035);
    --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',Tahoma,system-ui,sans-serif;
    background:
      radial-gradient(700px 420px at 85% -10%, rgba(212,175,55,.09), transparent 60%),
      radial-gradient(600px 400px at 8% 110%, rgba(212,175,55,.06), transparent 60%),
      var(--bg);
    color:var(--txt); overflow:hidden;
  }
  .app{display:flex;height:100dvh}

  /* ─── Sidebar ─── */
  .side{
    width:272px;min-width:272px;background:linear-gradient(180deg,#0d0d15,#0b0b12);
    border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:30;
    transition:margin .28s ease;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:18px 16px 14px}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--gold),#8a6d1f);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#0a0a10;font-size:15px;letter-spacing:.5px;
    box-shadow:0 0 18px rgba(212,175,55,.35);
  }
  .brand h1{font-size:1.02rem;font-weight:700;letter-spacing:.3px}
  .brand small{color:var(--gold);font-size:.68rem;display:block;margin-top:2px;letter-spacing:1.5px;text-transform:uppercase}
  .newchat{
    margin:6px 14px 12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--goldsoft);color:var(--gold2);font-weight:700;font-size:.9rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;
  }
  .newchat:hover{background:rgba(212,175,55,.22)}
  .side h2{padding:4px 18px 6px;font-size:.68rem;color:var(--mut);letter-spacing:1px}
  .chats{flex:1;overflow-y:auto;padding:0 10px 10px}
  .chats::-webkit-scrollbar{width:4px}
  .chats::-webkit-scrollbar-thumb{background:rgba(212,175,55,.25);border-radius:4px}
  .chat-item{
    padding:11px 12px;border-radius:11px;cursor:pointer;font-size:.85rem;color:var(--txt);
    display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px;
    border:1px solid transparent;transition:.15s;
  }
  .chat-item:hover{background:var(--glass)}
  .chat-item.on{background:var(--goldsoft);border-color:var(--line);color:var(--gold2)}
  .chat-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .chat-item .x{opacity:0;color:var(--mut);font-size:.75rem;padding:2px 5px;border-radius:6px}
  .chat-item:hover .x{opacity:1}
  .chat-item .x:hover{color:#ff7d7d}
  .sidefoot{padding:14px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:.68rem;text-align:center;letter-spacing:.5px}
  .sidefoot b{color:var(--gold);font-size:.75rem;display:block;margin-bottom:2px}

  /* ─── Main ─── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{
    display:flex;align-items:center;gap:10px;padding:13px 18px;
    border-bottom:1px solid var(--line);background:rgba(10,10,16,.8);backdrop-filter:blur(10px);
  }
  .burger{display:none;background:none;border:none;color:var(--gold);font-size:1.3rem;cursor:pointer;padding:4px 8px}
  .top .t{flex:1;min-width:0}
  .top b{font-size:.95rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top small{color:var(--mut);font-size:.7rem}
  .dot{width:8px;height:8px;border-radius:50%;background:#37d67a;box-shadow:0 0 8px #37d67a;flex:none}

  .msgs{flex:1;overflow-y:auto;padding:22px 16px 8px;scroll-behavior:smooth}
  .msgs::-webkit-scrollbar{width:5px}
  .msgs::-webkit-scrollbar-thumb{background:rgba(212,175,55,.2);border-radius:5px}
  .col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

  .wrap{display:flex;flex-direction:column;min-width:0}
  .msg{display:flex;gap:11px;align-items:flex-start;animation:up .3s ease}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.user{flex-direction:row-reverse}
  .av{
    width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:.8rem;font-weight:800;
  }
  .msg.bot .av{background:linear-gradient(135deg,var(--gold),#8a6d1f);color:#0a0a10;box-shadow:0 0 12px rgba(212,175,55,.3)}
  .msg.user .av{background:#1d1d29;color:var(--gold);border:1px solid var(--line)}
  .body{
    max-width:82%;padding:13px 16px;border-radius:var(--r);font-size:.93rem;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.bot .body{background:var(--glass);border:1px solid var(--line);border-top-right-radius:4px}
  .msg.user .body{
    background:linear-gradient(135deg,rgba(212,175,55,.16),rgba(212,175,55,.08));
    border:1px solid var(--line);border-top-left-radius:4px;
  }
  .body b,.body strong{color:var(--gold2)}
  .body code{background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px;font-size:.82rem;color:var(--gold2);direction:ltr;display:inline-block}
  .body pre{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:8px 0;direction:ltr;text-align:left}
  .body pre code{background:none;padding:0;display:block}
  .tools{display:flex;gap:4px;margin-top:6px;opacity:.75}
  .tool{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.72rem;padding:4px 8px;border-radius:7px}
  .tool:hover{color:var(--gold2);background:var(--glass)}

  .typing .body span{display:inline-flex;gap:5px;padding:6px 2px}
  .typing .body i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
  .typing .body i:nth-child(2){animation-delay:.2s}
  .typing .body i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}

  /* welcome / suggestions */
  .welcome{text-align:center;padding:40px 10px 10px;animation:up .5s ease}
  .welcome .big{
    width:76px;height:76px;border-radius:22px;margin:0 auto 18px;
    background:linear-gradient(135deg,var(--gold),#8a6d1f);
    display:flex;align-items:center;justify-content:center;font-size:2rem;
    box-shadow:0 0 40px rgba(212,175,55,.4);
  }
  .welcome h2{font-size:1.5rem;font-weight:800;letter-spacing:.5px}
  .welcome h2 em{color:var(--gold2);font-style:normal}
  .welcome p{color:var(--mut);margin-top:8px;font-size:.9rem}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;max-width:560px;margin-inline:auto}
  .chip{
    border:1px solid var(--line);background:var(--glass);color:var(--txt);
    padding:11px 16px;border-radius:20px;font-size:.84rem;cursor:pointer;transition:.2s;
  }
  .chip:hover{border-color:var(--gold);background:var(--goldsoft);color:var(--gold2)}

  /* ─── Input ─── */
  .composer{padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
  .bar{
    max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;
    background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:9px 9px 9px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);transition:border-color .2s;
  }
  .bar:focus-within{border-color:rgba(212,175,55,.55)}
  textarea{
    flex:1;background:none;border:none;outline:none;resize:none;color:var(--txt);
    font-family:inherit;font-size:.95rem;line-height:1.6;max-height:130px;padding:7px 0;
  }
  textarea::placeholder{color:var(--mut)}
  .send{
    width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;flex:none;
    background:linear-gradient(135deg,var(--gold),#a8842a);color:#0a0a10;font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  .send:hover{box-shadow:0 0 16px rgba(212,175,55,.5);transform:scale(1.05)}
  .send:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
  .foot{max-width:780px;margin:8px auto 0;text-align:center;color:var(--mut);font-size:.66rem}
  .foot b{color:var(--gold)}

  /* ─── Mobile ─── */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25;opacity:0;pointer-events:none;transition:.25s}
  .ovl.on{opacity:1;pointer-events:auto}
  @media(max-width:820px){
    .side{position:fixed;top:0;bottom:0;right:0;margin-right:-272px;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
    .side.on{margin-right:0}
    .burger{display:block}
    .body{max-width:88%}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">EC</div>
      <h1 id="brandName">EASY CODE<small id="brandSlogan">Apps Made Easy</small></h1>
    </div>
    <button class="newchat" id="newChat">＋ محادثة جديدة</button>
    <h2>المحادثات</h2>
    <div class="chats" id="chats"></div>
    <div class="sidefoot"><b id="sideBrand">EASY CODE</b>Apps Made Easy — © كل الحقوق محفوظة</div>
  </aside>
  <div class="ovl" id="ovl"></div>

  <main class="main">
    <div class="top">
      <button class="burger" id="burger">☰</button>
      <div class="t"><b id="chatTitle">EASY AI</b><small>مساعد ذكي من EASY CODE</small></div>
      <div class="dot" title="متصل"></div>
    </div>
    <div class="msgs" id="msgs"><div class="col" id="col"></div></div>
    <div class="composer">
      <div class="bar">
        <textarea id="inp" rows="1" placeholder="اكتب رسالتك هنا…"></textarea>
        <button class="send" id="send" title="إرسال">➤</button>
      </div>
      <div class="foot">✦ <b id="footBrand">EASY CODE</b> — Apps Made Easy ✦</div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { key: 'easyai_chats_v1', cur: 'easyai_cur_v1' };

/* branding */
let CHATS = [];
try { CHATS = JSON.parse(localStorage.getItem(LS.key) || '[]'); } catch (e) { CHATS = []; }
let CUR = localStorage.getItem(LS.cur) || null;
let busy = false;

function saveChats() {
  try { localStorage.setItem(LS.key, JSON.stringify(CHATS.slice(-60))); localStorage.setItem(LS.cur, CUR || ''); } catch (e) {}
}
function cur() { return CHATS.find(c => c.id === CUR); }

/* apply client branding from CONFIG */
(function brand() {
  const t = (CONFIG.CLIENT_NAME ? 'EASY AI — ' + CONFIG.CLIENT_NAME : 'EASY AI');
  document.title = t;
  if (CONFIG.BRAND) { $('brandName').childNodes[0].nodeValue = CONFIG.BRAND + ' '; $('sideBrand').textContent = CONFIG.BRAND; $('footBrand').textContent = CONFIG.BRAND; }
  $('chatTitle').textContent = t;
})();

/* ─── markdown-lite ─── */
function md(t) {
  let h = esc(t);
  h = h.replace(/```([\s\S]*?)```/g, (m, c) => '<pre><code>' + c.trim() + '</code></pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
  return h;
}

/* ─── rendering ─── */
function renderMsgs() {
  const c = cur();
  const col = $('col');
  col.innerHTML = '';
  if (!c || !c.messages.length) { welcome(); return; }
  for (const m of c.messages) col.appendChild(bubble(m.role, m.content));
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function welcome() {
  const w = document.createElement('div');
  w.className = 'welcome';
  w.innerHTML = `<div class="big">✦</div>
    <h2><em>EASY AI</em> مساعدك الذكي</h2>
    <p>اسألني في أي حاجة — جاهز على طول</p>
    <div class="chips">
      <button class="chip">اكتبلي إعلان لمنتجي 📣</button>
      <button class="chip">فكر معايا في مشروع 💡</button>
      <button class="chip">ترجم نص لإنجليزي 🌐</button>
      <button class="chip">اكتب كابشن للسوشيال ميديا ✨</button>
      <button class="chip">اشرحلي موضوع معقد ببساطة 📚</button>
    </div>`;
  $('col').appendChild(w);
  w.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { $('inp').value = ch.textContent.trim(); send(); });
}
function bubble(role, content) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.innerHTML = `<div class="av">${role === 'user' ? 'أنت' : 'AI'}</div>
    <div class="wrap"><div class="body">${md(content)}</div>
    ${role !== 'user' ? `<div class="tools"><button class="tool" data-a="copy">📋 نسخ</button><button class="tool" data-a="re">🔄 أعادة</button></div>` : ''}</div>`;
  if (role !== 'user') {
    d.querySelector('[data-a=copy]').onclick = () => copy(content);
    d.querySelector('[data-a=re]').onclick = () => regen();
  }
  return d;
}
function typingBubble() {
  const d = document.createElement('div');
  d.className = 'msg bot typing'; d.id = 'tb';
  d.innerHTML = `<div class="av">AI</div><div class="body"><span><i></i><i></i><i></i></span></div>`;
  $('col').appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight;
  return d;
}
function copy(t) {
  navigator.clipboard?.writeText(t).then(() => toast('تم النسخ ✓')).catch(() => {});
}
let toastT;
function toast(t) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.style.opacity = 1; clearTimeout(toastT);
  toastT = setTimeout(() => el.style.opacity = 0, 1600);
}
(function toastCSS() {
  const s = document.createElement('style');
  s.textContent = '.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#15151f;border:1px solid var(--line);color:var(--gold2);padding:9px 18px;border-radius:20px;font-size:.8rem;opacity:0;transition:.3s;z-index:99;pointer-events:none}';
  document.head.appendChild(s);
})();

/* ─── conversations ─── */
function renderList() {
  const box = $('chats');
  box.innerHTML = '';
  if (!CHATS.length) { box.innerHTML = '<p style="color:var(--mut);font-size:.78rem;padding:8px 10px">لسه مفيش محادثات — ابدأ واحدة جديدة ✨</p>'; return; }
  [...CHATS].reverse().forEach(c => {
    const d = document.createElement('div');
    d.className = 'chat-item' + (c.id === CUR ? ' on' : '');
    d.innerHTML = `<span>${esc(c.title || 'محادثة')}</span><button class="x">✕</button>`;
    d.onclick = e => {
      if (e.target.classList.contains('x')) { e.stopPropagation(); delChat(c.id); return; }
      CUR = c.id; saveChats(); renderList(); renderMsgs(); closeSide();
    };
    box.appendChild(d);
  });
}
function delChat(id) {
  CHATS = CHATS.filter(c => c.id !== id);
  if (CUR === id) { CUR = CHATS.length ? CHATS[CHATS.length - 1].id : null; }
  saveChats(); renderList(); renderMsgs();
}
function newChat() {
  CUR = 'c' + Date.now();
  CHATS.push({ id: CUR, title: '', messages: [] });
  saveChats(); renderList(); renderMsgs(); closeSide();
  $('inp').focus();
}

/* ─── send / AI ─── */
async function send() {
  const t = $('inp').value.trim();
  if (!t || busy) return;
  if (!navigator.onLine) { toast('مفيش إنترنت — اتصل الأول 📡'); return; }
  let c = cur();
  if (!c) { newChat(); c = cur(); }
  $('inp').value = ''; $('inp').style.height = 'auto';
  c.messages.push({ role: 'user', content: t });
  if (!c.title) c.title = t.slice(0, 32);
  saveChats(); renderList(); renderMsgs();
  await ask(c);
}
async function ask(c) {
  busy = true; $('send').disabled = true;
  const tb = typingBubble();
  try {
    const r = await (await fetch(CONFIG.API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: CONFIG.MODEL, messages: c.messages.slice(-20) })
    })).json();
    tb.remove();
    if (r.ok && r.reply) c.messages.push({ role: 'assistant', content: r.reply });
    else c.messages.push({ role: 'assistant', content: r.error || 'حصل خطأ — جرب تاني 🙏' });
  } catch (e) {
    tb.remove();
    c.messages.push({ role: 'assistant', content: 'مفيش اتصال بالخدمة — بص على النت وجرّب تاني 📡' });
  }
  saveChats(); renderMsgs();
  busy = false; $('send').disabled = false;
}
async function regen() {
  const c = cur();
  if (!c || busy) return;
  while (c.messages.length && c.messages[c.messages.length - 1].role === 'assistant') c.messages.pop();
  saveChats(); renderMsgs();
  await ask(c);
}

/* ─── input ─── */
$('inp').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
});
$('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('send').onclick = send;
$('newChat').onclick = newChat;

/* sidebar mobile */
function closeSide() { $('side').classList.remove('on'); $('ovl').classList.remove('on'); }
$('burger').onclick = () => { $('side').classList.toggle('on'); $('ovl').classList.toggle('on'); };
$('ovl').onclick = closeSide;

/* first greeting message if fresh */
(function init() {
  if (!CUR && !CHATS.length) {
    CUR = 'c' + Date.now();
    CHATS.push({ id: CUR, title: 'ترحيب', messages: [] });
    saveChats();
  }
  renderList();
  renderMsgs();
  const c = cur();
  if (c && !c.messages.length) { c.messages.push({ role: 'assistant', content: CONFIG.GREETING }); saveChats(); renderMsgs(); }
})();
</script>
</body>
</html>
